<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Mottainai Neon</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page">
<div class="login-container">
  <div class="login-box">
    <div class="logo">🌱</div>
    <h1>Mottainai Neon</h1>
    <p class="subtitle">Admin Dashboard</p>
    <form id="loginForm" onsubmit="return doLogin(event)">
      <label>Email</label>
      <input type="email" id="email" class="input" value="admin@mottainai.com" required>
      <label>Password</label>
      <input type="password" id="password" class="input" required>
      <button type="submit" class="btn btn-primary btn-full">Sign In</button>
    </form>
    <p id="loginError" class="error-msg"></p>
  </div>
</div>

<!-- ✅ CORRECT ORDER: api FIRST, then auth -->
<script src="js/admin-api.js"></script>
<script src="js/admin-auth.js"></script>

<script>
// Inline login handler (no external file needed)
async function doLogin(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('loginError');
  errorEl.textContent = 'Signing in...';
  
  try {
    const result = await adminLogin(email, password);
    if (result.success) {
      errorEl.style.color = '#10b981';
      errorEl.textContent = '✓ Success! Redirecting...';
      setTimeout(() => { window.location.href = 'index.html'; }, 500);
    } else {
      errorEl.style.color = '#ef4444';
      errorEl.textContent = result.error || 'Login failed';
    }
  } catch (err) {
    errorEl.style.color = '#ef4444';
    errorEl.textContent = 'Error: ' + err.message;
  }
  return false;
}
</script>
</body>
</html>
